{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card text-center">
            <div class="mb-4">
                <i class="fas fa-globe-americas fa-3x text-success"></i>
                <h2 class="mt-3 fw-bold" style="color: var(--primary-green);">Welcome Back</h2>
                <p class="text-muted">Login to manage your earth-friendly contributions</p>
            </div>

            <form action="/" method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-earth w-100 py-2">
                    Login to Dashboard <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="mt-4">
                <p class="small text-muted">New to EarthCare? <a href="/register" class="text-success fw-bold text-decoration-none">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
