{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-success"></i>
                <h2 class="mt-3 fw-bold" style="color: var(--primary-green);">Join EarthCare</h2>
                <p class="text-muted">Create an account to start your green journey</p>
            </div>

            <form action="/register" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create password" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter mobile number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Register As</label>
                    <select name="role" class="form-select border-success">
                        <option value="user">Customer (User)</option>
                        <option value="worker">Collection Agent (Worker)</option>
                    </select>
                    <small class="text-muted">Workers will be visible to Admin for task assignment.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Address</label>
                    <textarea name="address" class="form-control" rows="3" placeholder="Enter your full home address" required></textarea>
                </div>

                <button type="submit" class="btn btn-earth w-100 py-2">
                    Create Account <i class="fas fa-leaf ms-2"></i>
                </button>
            </form>

            <div class="mt-4 text-center">
                <p class="small text-muted">Already a member? <a href="/" class="text-success fw-bold text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
